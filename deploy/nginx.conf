# ConfigLake – Nginx reverse proxy with TLS termination
#
# Usage:
#   1. Replace YOUR_DOMAIN with your actual domain (e.g. configlake.example.com).
#   2. Point ssl_certificate / ssl_certificate_key to your cert files.
#      To get a free cert: certbot --nginx -d YOUR_DOMAIN
#   3. Place this file at /etc/nginx/sites-available/configlake
#      and symlink: ln -s /etc/nginx/sites-available/configlake /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Redirect all HTTP traffic to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Modern TLS settings (A+ on SSL Labs).
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # Security headers.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff                                       always;
    add_header X-Frame-Options           SAMEORIGIN                                    always;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Tell Flask the original scheme so request.scheme == 'https'.
        proxy_set_header   X-Forwarded-Proto  https;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   Host               $host;
        proxy_redirect     off;

        # Reasonable timeouts.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
